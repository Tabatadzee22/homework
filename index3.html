<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>

    <div class="signup-card">
        <h2>Sign up</h2>
        <p class="subtitle">Create a free account to get started</p>
        <form>
            <div class="field">
                <label>Email</label>
                <input type="email">
            </div>
            <div class="field">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password">
                    <span class="show-btn">Show</span>
                </div>
                <div class="hint">
                    <span class="dot">○</span> Your password must be at least 8 characters long.
                </div>
            </div>
            <div class="error-box">
                <span class="error-icon">ⓘ</span> invalid entry
            </div>
            <p class="terms">
                By signing up, you agree with our <a href="#">Terms & conditions</a> and <a href="#">Privacy statement</a>.
            </p>
            <button type="submit" class="signup-btn">Sign up</button>
            <div class="divider">
                <span>OR</span>
            </div>
            <div class="social-buttons">
                <button type="button" class="social-btn">
                    <span class="icon google">G</span> Continue with Google
                </button>
                <button type="button" class="social-btn">
                    <span class="icon facebook">f</span> Continue with Facebook
                </button>
                <button type="button" class="social-btn">
                    <span class="icon apple"></span> Continue with Apple
                </button>
            </div>
        </form>
    </div>

</body>
</html>
